<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Whitepages - {{FULL_NAME}} Summary</title>
</head>
<body>
    <div class="whitepages-wrapper">
        <div class="card-person">
            <h2 class="name">{{FULL_NAME}}</h2>
            <div class="location">{{CURRENT_CITY}}, {{CURRENT_STATE}}</div>
            <div class="address-details">
                <p class="current-residence">{{KNOWN_ADDRESS}}</p>
            </div>
            <div class="phone-numbers">
                <p>Phone: {{PHONE}}</p>
            </div>
            <div class="email-records">
                <p>Email: {{PRIMARY_EMAIL}}</p>
            </div>
            <div class="relatives">
                <p>Relatives: {{RELATIVE_1}}, {{RELATIVE_2}}</p>
            </div>
            <div class="suppression-link-container">
                <a href="https://www.whitepages.com/suppression-requests">Manage & Suppress Listing</a>
            </div>
        </div>
    </div>
</body>
</html>
